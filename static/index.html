<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Quản lý công việc</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .auth-forms {
            display: none; /* Controlled via JS */
        }
        .task-manager {
            display: none; /* Controlled via JS */
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }
        .tab.active {
            border-bottom: 2px solid #6366f1;
            color: #4f46e5;
            font-weight: 600;
        }
        .flash-message {
            display: none;
        }
        .flash-message.success {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .flash-message.error {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div class="container max-w-4xl mx-auto px-4 py-10">
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-2xl shadow-lg shadow-indigo-500/25 text-white mb-3 text-2xl font-bold">
                ✓
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Task Manager</h1>
            <p class="text-slate-500 text-sm mt-1">Hệ thống quản lý công việc cá nhân thông minh và tối giản</p>
        </header>

        <!-- Flash messages -->
        <div id="flash-message" class="flash-message max-w-md mx-auto mb-6 p-4 rounded-xl text-sm font-medium shadow-sm transition-all duration-300"></div>

        <!-- Auth forms (login/register) -->
        <div class="auth-forms max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100" id="auth-forms">
            <!-- Tabs -->
            <div class="tabs flex border-b border-slate-200 mb-6">
                <div class="tab active flex-1 py-3 text-center cursor-pointer text-slate-500 hover:text-indigo-600 transition-colors" data-tab="login">Đăng nhập</div>
                <div class="tab flex-1 py-3 text-center cursor-pointer text-slate-500 hover:text-indigo-600 transition-colors" data-tab="register">Đăng ký</div>
            </div>

            <!-- Login Tab -->
            <div class="tab-panel active" id="login-panel">
                <form id="login-form" class="space-y-5">
                    <div class="form-group">
                        <label for="login-username" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Tên đăng nhập</label>
                        <input type="text" id="login-username" required placeholder="Nhập username" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-slate-50/50 focus:bg-white">
                    </div>
                    <div class="form-group">
                        <label for="login-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Mật khẩu</label>
                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-slate-50/50 focus:bg-white">
                        <label class="mt-2.5 inline-flex items-center text-xs text-slate-500 hover:text-slate-700 cursor-pointer select-none">
                            <input type="checkbox" onchange="document.getElementById('login-password').type = this.checked ? 'text' : 'password'" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-3.5 h-3.5 mr-2">
                            Hiển thị mật khẩu
                        </label>
                    </div>
                    <button type="submit" class="w-full py-3 px-4 rounded-xl text-white font-semibold text-sm bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-[0.99] transition-all shadow-md shadow-indigo-600/20 disabled:opacity-50 disabled:cursor-not-allowed">Đăng nhập</button>
                    <p class="text-center text-xs text-slate-500 pt-2">Chưa có tài khoản? <a href="#" id="show-register" class="font-semibold text-indigo-600 hover:text-indigo-500">Đăng ký ngay</a></p>
                </form>
            </div>

            <!-- Register Tab -->
            <div class="tab-panel" id="register-panel">
                <form id="register-form" class="space-y-5">
                    <div class="form-group">
                        <label for="register-username" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Tên đăng nhập</label>
                        <input type="text" id="register-username" required placeholder="Nhập username mong muốn" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-slate-50/50 focus:bg-white">
                    </div>
                    <div class="form-group">
                        <label for="register-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Mật khẩu <span class="text-rose-500 font-normal lowercase">(chứa ký tự @)</span></label>
                        <input type="password" id="register-password" required placeholder="Ví dụ: matkhau@123" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-slate-50/50 focus:bg-white">
                        <label class="mt-2.5 inline-flex items-center text-xs text-slate-500 hover:text-slate-700 cursor-pointer select-none">
                            <input type="checkbox" onchange="document.getElementById('register-password').type = this.checked ? 'text' : 'password'" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-3.5 h-3.5 mr-2">
                            Hiển thị mật khẩu
                        </label>
                    </div>
                    <button type="submit" class="w-full py-3 px-4 rounded-xl text-white font-semibold text-sm bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-[0.99] transition-all shadow-md shadow-emerald-600/20 disabled:opacity-50 disabled:cursor-not-allowed">Đăng ký tài khoản</button>
                    <p class="text-center text-xs text-slate-500 pt-2">Đã có tài khoản? <a href="#" id="show-login" class="font-semibold text-indigo-600 hover:text-indigo-500">Đăng nhập</a></p>
                </form>
            </div>
        </div>

        <!-- Task manager (shown after login) -->
        <div class="task-manager bg-white p-6 sm:p-8 rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100" id="task-manager">
            <!-- Header controls -->
            <div class="header-controls flex items-center justify-between pb-6 mb-6 border-b border-slate-100">
                <div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Danh sách công việc</h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Theo dõi và cập nhật tiến độ công việc của bạn</p>
                </div>
                <button id="logout-btn" class="secondary inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 hover:text-slate-800 active:scale-95 transition-all">
                    <span>Đăng xuất</span>
                </button>
            </div>
            
            <!-- Create Task Card/Form -->
            <div class="bg-slate-50/70 p-5 rounded-xl border border-slate-200/70 mb-8 space-y-4">
                <div class="form-group">
                    <label for="task-title" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Tiêu đề công việc <span class="text-rose-500">*</span></label>
                    <input type="text" id="task-title" placeholder="Ví dụ: Hoàn thiện báo cáo quý..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-white">
                </div>
                <div class="form-group">
                    <label for="task-content" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Chi tiết nội dung <span class="text-slate-400 font-normal lowercase">(tùy chọn)</span></label>
                    <textarea id="task-content" rows="3" placeholder="Nhập thêm ghi chú, thời hạn, hoặc mô tả chi tiết..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-white resize-y"></textarea>
                </div>
                <div class="flex justify-end">
                    <button id="add-task-btn" class="px-5 py-2.5 rounded-xl text-white font-semibold text-sm bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 shadow-md shadow-indigo-600/20 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        + Thêm công việc
                    </button>
                </div>
            </div>

            <!-- Task List Container -->
            <div id="task-list" class="overflow-x-auto"></div>
        </div>
    </div>

    <script>
        // API base URL
        const API_BASE = '/api';

        // State
        let currentUserId = null;

        // DOM elements
        const authForms = document.getElementById('auth-forms');
        const taskManager = document.getElementById('task-manager');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const flashMessage = document.getElementById('flash-message');
        const taskList = document.getElementById('task-list');
        const addTaskBtn = document.getElementById('add-task-btn');
        const taskTitleInput = document.getElementById('task-title');
        const taskContentInput = document.getElementById('task-content');

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
                const tabPanelId = tab.getAttribute('data-tab') + '-panel';
                document.getElementById(tabPanelId).classList.add('active');
            });
        });

        // Show/hide forms
        document.getElementById('show-register').addEventListener('click', e => {
            e.preventDefault();
            document.querySelector('[data-tab="register"]').click();
        });
        document.getElementById('show-login').addEventListener('click', e => {
            e.preventDefault();
            document.querySelector('[data-tab="login"]').click();
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            currentUserId = null;
            authForms.style.display = 'block';
            taskManager.style.display = 'none';
            showFlash('Logged out successfully', 'success');
        });

        // Flash message function
        function showFlash(message, type = 'error') {
            flashMessage.textContent = message;
            flashMessage.className = `flash-message ${type}`;
            flashMessage.style.display = 'block';
            setTimeout(() => {
                flashMessage.style.display = 'none';
            }, 3000);
        }

        // API request helper
        async function apiRequest(endpoint, options = {}) {
            const url = API_BASE + endpoint;
            const config = {
                method: options.method || 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                },
                body: options.body ? JSON.stringify(options.body) : undefined,
                credentials: 'same-origin'
            };

            try {
                const response = await fetch(url, config);
                let data = {};
                try {
                    data = await response.json();
                } catch (e) {
                    // In case server returns non-JSON error
                }
                
                if (!response.ok) {
                    throw new Error(data.error || `Yêu cầu thất bại (Mã lỗi: ${response.status})`);
                }
                return { success: true, data };
            } catch (error) {
                // Check if network error (fetch failed, offline, connection refused, etc.)
                let message = error.message;
                if (!navigator.onLine || error.name === 'TypeError' || error.message.toLowerCase().includes('fetch') || error.message.toLowerCase().includes('network')) {
                    message = 'Lỗi kết nối mạng: Không thể kết nối tới máy chủ. Vui lòng kiểm tra lại đường truyền hoặc server!';
                }
                return { success: false, error: message };
            }
        }
        
        // Login handler
        loginForm.addEventListener('submit', async e => {
            e.preventDefault();
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Loading...';

            try {
                const result = await apiRequest('/login', {
                    method: 'POST',
                    body: { username, password }
                });

                if (result.success) {
                    currentUserId = result.data.user_id;
                    authForms.style.display = 'none';
                    taskManager.style.display = 'block';
                    showFlash('Đăng nhập thành công!', 'success');
                    loadTasks();
                    loginForm.reset();
                } else {
                    showFlash(result.error || 'Đăng nhập thất bại');
                }
            } catch (error) {
                showFlash('Lỗi kết nối mạng: Không thể kết nối tới máy chủ. Vui lòng thử lại!', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        // Register handler
        registerForm.addEventListener('submit', async e => {
            e.preventDefault();
            const submitBtn = registerForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;

            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Loading...';

            try {
                const result = await apiRequest('/register', {
                    method: 'POST',
                    body: { username, password }
                });

                if (result.success) {
                    showFlash('Đăng ký thành công! Vui lòng đăng nhập.', 'success');
                    document.querySelector('[data-tab="login"]').click();
                    registerForm.reset();
                } else {
                    showFlash(result.error || 'Đăng ký thất bại');
                }
            } catch (error) {
                showFlash('Lỗi kết nối mạng: Không thể kết nối tới máy chủ. Vui lòng thử lại!', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
        
        // Add task handler
        addTaskBtn.addEventListener('click', async () => {
            const title = taskTitleInput.value.trim();
            const content = taskContentInput.value.trim();

            if (!title) {
                showFlash('Vui lòng nhập tiêu đề công việc');
                return;
            }

            const originalText = addTaskBtn.textContent;
            addTaskBtn.disabled = true;
            addTaskBtn.textContent = 'Loading...';

            try {
                const result = await apiRequest('/tasks', {
                    method: 'POST',
                    body: { user_id: currentUserId, title, content }
                });

                if (result.success) {
                    showFlash('Thêm công việc thành công!', 'success');
                    taskTitleInput.value = '';
                    taskContentInput.value = '';
                    loadTasks();
                } else {
                    showFlash(result.error || 'Thêm công việc thất bại');
                }
            } catch (error) {
                showFlash('Lỗi kết nối mạng: Không thể kết nối tới máy chủ. Vui lòng thử lại!', 'error');
            } finally {
                addTaskBtn.disabled = false;
                addTaskBtn.textContent = originalText;
            }
        });
        
        // Load tasks
        async function loadTasks() {
            taskList.innerHTML = '<div class="loading">Loading tasks...</div>';
            
            try {
                const result = await apiRequest(`/tasks?user_id=${currentUserId}`);
                
                if (result.success) {
                    renderTasks(result.data.tasks);
                } else {
                    taskList.innerHTML = `<div class="no-tasks">Lỗi tải danh sách công việc: ${escapeHtml(result.error)}</div>`;
                    showFlash(result.error, 'error');
                }
            } catch (error) {
                const netErr = 'Lỗi kết nối mạng: Không thể tải danh sách công việc.';
                taskList.innerHTML = `<div class="no-tasks">${netErr}</div>`;
                showFlash(netErr, 'error');
            }
        }
        
        // Render tasks
        function renderTasks(tasks) {
            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="no-tasks text-center py-12 px-4 rounded-xl border border-dashed border-slate-200 text-slate-400 text-sm">Chưa có công việc nào. Hãy thêm công việc mới ở trên!</div>';
                return;
            }

            const table = document.createElement('table');
            table.className = 'w-full text-left border-collapse';
            table.innerHTML = `
                <thead>
                    <tr class="border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500 bg-slate-50/50">
                        <th class="py-3.5 px-4 rounded-l-xl">Tiêu đề</th>
                        <th class="py-3.5 px-4">Nội dung</th>
                        <th class="py-3.5 px-4">Trạng thái</th>
                        <th class="py-3.5 px-4">Thời gian</th>
                        <th class="py-3.5 px-4 text-right rounded-r-xl">Thao tác</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm">
                    ${tasks.map(task => `
                        <tr class="hover:bg-slate-50/80 transition-colors group">
                            <td class="py-3.5 px-4 font-semibold text-slate-800">${escapeHtml(task.title)}</td>
                            <td class="py-3.5 px-4 text-slate-500 max-w-xs truncate">${escapeHtml(task.content || '—')}</td>
                            <td class="py-3.5 px-4">
                                <select class="status-select text-xs font-medium py-1.5 px-2.5 rounded-lg border border-slate-200 bg-white text-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all cursor-pointer" data-id="${task.id}">
                                    <option value="pending" ${task.status === 'pending' ? 'selected' : ''}>⏳ Pending</option>
                                    <option value="in_progress" ${task.status === 'in_progress' ? 'selected' : ''}>🚀 In Progress</option>
                                    <option value="done" ${task.status === 'done' ? 'selected' : ''}>✅ Done</option>
                                </select>
                            </td>
                            <td class="py-3.5 px-4 text-xs text-slate-400">${new Date(task.created_at).toLocaleString('vi-VN')}</td>
                            <td class="py-3.5 px-4 text-right task-actions">
                                <button class="danger delete-btn inline-flex items-center text-xs font-semibold py-1.5 px-3 rounded-lg text-rose-600 bg-rose-50 hover:bg-rose-600 hover:text-white transition-all shadow-sm active:scale-95" data-id="${task.id}">
                                    Xóa
                                </button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            `;

            taskList.innerHTML = '';
            taskList.appendChild(table);

            // Add event listeners to status selects
            taskList.querySelectorAll('.status-select').forEach(select => {
                select.addEventListener('change', async () => {
                    const taskId = parseInt(select.getAttribute('data-id'));
                    const newStatus = select.value;
                    
                    select.disabled = true;
                    
                    try {
                        const result = await apiRequest(`/tasks/${taskId}/status`, {
                            method: 'PUT',
                            body: { user_id: currentUserId, status: newStatus }
                        });

                        if (result.success) {
                            showFlash('Cập nhật trạng thái công việc thành công!', 'success');
                        } else {
                            showFlash(result.error || 'Cập nhật trạng thái thất bại');
                            loadTasks(); // reload to revert to old status
                        }
                    } catch (error) {
                        showFlash('Lỗi kết nối mạng: Không thể cập nhật trạng thái công việc!', 'error');
                        loadTasks();
                    } finally {
                        select.disabled = false;
                    }
                });
            });

            // Add event listeners to delete buttons
            taskList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const taskId = parseInt(btn.getAttribute('data-id'));
                    if (!confirm('Are you sure you want to delete this task?')) return;

                    const originalText = btn.textContent;
                    btn.disabled = true;
                    btn.textContent = 'Loading...';

                    try {
                        const result = await apiRequest(`/tasks/${taskId}`, {
                            method: 'DELETE',
                            body: { user_id: currentUserId }
                        });

                        if (result.success) {
                            showFlash('Xóa công việc thành công!', 'success');
                            loadTasks();
                        } else {
                            showFlash(result.error || 'Xóa công việc thất bại');
                            btn.disabled = false;
                            btn.textContent = originalText;
                        }
                    } catch (error) {
                        showFlash('Lỗi kết nối mạng: Không thể xóa công việc!', 'error');
                        btn.disabled = false;
                        btn.textContent = originalText;
                    }
                });
            });
        }
        
        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Initialize: show auth forms, hide task manager
        authForms.style.display = 'block';
        taskManager.style.display = 'none';
    </script>
</body>
</html>
